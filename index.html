<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>God's life — Minha Rádio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .radio {
      width: 100%;
      max-width: 350px;
      padding: 28px 24px;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 24px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
    }

    #titulo-musica {
      font-size: 17px;
      font-weight: bold;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    #relogio-brasilia {
      font-size: 15px;
      color: #4ade80;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
    }

    .play {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: #22c55e;
      color: #052e16;
      font-size: 28px;
      cursor: pointer;
    }

    .play:disabled {
      opacity: .5;
      cursor: wait;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #22c55e;
      cursor: pointer;
    }

    .times {
      display: flex;
      justify-content: space-between;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 5px;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .status {
      min-height: 18px;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }

    .error { color: #fca5a5; }
  </style>
</head>

<body>
  <main class="radio">

    <img
      class="logo"
      src="https://i.imgur.com/ZRHzLQK.jpeg"
      alt="Logo God's life"
      onerror="this.style.display='none'"
    >

    <h1>God's life</h1>

    <div id="titulo-musica">Minha Rádio</div>
    <div id="relogio-brasilia">--:--:--</div>

    <audio id="audio" preload="auto"></audio>

    <div class="controls">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Reproduzir"
        disabled
      >▶</button>
    </div>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      aria-label="Progresso"
      disabled
    >

    <div class="times">
      <span id="elapsed">00:00</span>
      <span id="duration">00:00</span>
    </div>

    <div class="volume">
      <span aria-hidden="true">🔊</span>
      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="80"
        aria-label="Volume"
      >
    </div>

    <div id="status" class="status">Carregando rádio...</div>
  </main>

  <script>
    "use strict";

    const JSON_URL =
      "https://raw.githubusercontent.com/Isac-Arqueiro/mylist/refs/heads/main/musicas.json";

    const STORAGE_KEY = "radio-audio-only-v1";

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const elapsed = document.getElementById("elapsed");
    const duration = document.getElementById("duration");
    const status = document.getElementById("status");
    const tituloMusica = document.getElementById("titulo-musica");
    const relogioBrasilia = document.getElementById("relogio-brasilia");

    let config = {};
    let musicas = [];
    let fila = [];
    let indice = 0;

    let reproduzindo = false;
    let desejaReproduzir = false;
    let buscando = false;
    let tempoPendente = 0;

    // Controle da música que está efetivamente tocando.
    let idFaixaAtual = null;
    let tocandoAgendada = false;

    // Faixas agendadas aguardando sua vez.
    let agendadasPendentes = [];

    // Impede que o mesmo horário seja adicionado várias vezes no dia.
    let agendamentosProcessados = new Set();
    let dataBrasiliaAnterior = "";
    let minutoBrasiliaAnterior = 0;

    // Controle de eventos duplicados.
    let eventoFaixaResolvido = true;
    let operacaoReproducao = 0;

    // Após uma faixa normal terminar, ela precisa ser avançada.
    // Se houver faixa agendada, o avanço normal espera por ela.
    let normalPrecisaAvancar = false;

    function mensagem(texto, erro = false) {
      status.textContent = texto;
      status.classList.toggle("error", erro);
    }

    function tempo(segundos) {
      if (!Number.isFinite(segundos) || segundos < 0) {
        return "00:00";
      }

      const n = Math.floor(segundos);

      return String(Math.floor(n / 60)).padStart(2, "0") +
        ":" + String(n % 60).padStart(2, "0");
    }

    function embaralhar(lista) {
      const resultado = [...lista];

      for (let i = resultado.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [resultado[i], resultado[j]] =
          [resultado[j], resultado[i]];
      }

      return resultado;
    }

    // Obtém data e hora usando o fuso oficial de Brasília.
    function horarioBrasilia() {
      const partes = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Sao_Paulo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const p = {};

      for (const parte of partes) {
        if (parte.type !== "literal") {
          p[parte.type] = parte.value;
        }
      }

      return {
        data: `${p.year}-${p.month}-${p.day}`,
        hora: `${p.hour}:${p.minute}`,
        minuto: Number(p.hour) * 60 + Number(p.minute),
        texto: `${p.hour}:${p.minute}:${p.second}`
      };
    }

    function atualizarRelogio() {
      relogioBrasilia.textContent = horarioBrasilia().texto;
    }

    function urlDeAudio(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        const caminho = u.pathname.toLowerCase();

        // Rejeita páginas do YouTube.
        if (
          host === "youtu.be" ||
          host === "youtube.com" ||
          host.endsWith(".youtube.com") ||
          host === "youtube-nocookie.com" ||
          host.endsWith(".youtube-nocookie.com")
        ) {
          return null;
        }

        // Converte links públicos do Google Drive.
        if (
          host === "drive.google.com" ||
          host === "docs.google.com"
        ) {
          let id = u.searchParams.get("id");
          const partes = caminho.split("/");
          const i = partes.findIndex(p => p === "d");

          if (!id && i >= 0) {
            id = partes[i + 1];
          }

          if (!id) return null;

          return "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(id);
        }

        return u.href;
      } catch (_) {
        return null;
      }
    }

    function faixaDaFila() {
      return musicas.find(m => m.id === fila[indice]) || null;
    }

    function faixaPorId(id) {
      return musicas.find(m => String(m.id) === String(id)) || null;
    }

    function faixaVisivel() {
      return faixaPorId(idFaixaAtual) || faixaDaFila();
    }

    function salvar() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          fila,
          indice,
          tempo: audio.currentTime || 0,
          volume: Number(volume.value)
        }));
      } catch (_) {}
    }

    function prepararFila() {
      let salvo = null;

      try {
        salvo = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (_) {}

      const ids = new Set(musicas.map(m => String(m.id)));

      if (
        salvo &&
        Array.isArray(salvo.fila) &&
        salvo.fila.length === musicas.length &&
        salvo.fila.every(id => ids.has(String(id))) &&
        new Set(salvo.fila.map(String)).size === musicas.length &&
        Number.isInteger(salvo.indice) &&
        salvo.indice >= 0 &&
        salvo.indice < salvo.fila.length
      ) {
        fila = salvo.fila;
        indice = salvo.indice;
        tempoPendente = Math.max(0, Number(salvo.tempo) || 0);

        if (salvo.volume != null) {
          volume.value = Math.max(
            0,
            Math.min(100, Number(salvo.volume))
          );
        }

        return;
      }

      const primeira = config.tocarPrimeiro
        ? musicas.find(m => String(m.id) === String(config.tocarPrimeiro))
        : null;

      fila = [
        ...(primeira ? [primeira.id] : []),
        ...embaralhar(
          musicas.filter(m => !primeira || m.id !== primeira.id)
        ).map(m => m.id)
      ];

      indice = 0;
      tempoPendente = 0;
    }

    function atualizarTituloMusica() {
      const faixa = faixaVisivel();

      tituloMusica.textContent =
        faixa && faixa.titulo ? faixa.titulo : "Minha Rádio";

      if ("mediaSession" in navigator && "MediaMetadata" in window) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: faixa?.titulo || "God's life",
          artist: faixa?.artista || "God's life",
          album: "Minha Rádio",
          artwork: [{
            src: "https://i.imgur.com/ZRHzLQK.jpeg",
            sizes: "192x192",
            type: "image/jpeg"
          }]
        });
      }
    }

    function atualizarBotao() {
      playBtn.textContent = reproduzindo ? "Ⅱ" : "▶";

      playBtn.setAttribute(
        "aria-label",
        reproduzindo ? "Pausar" : "Reproduzir"
      );

      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState =
          reproduzindo ? "playing" : "paused";
      }
    }

    function registrarControlesDeMidia() {
      if (!("mediaSession" in navigator)) return;

      try {
        navigator.mediaSession.setActionHandler("play", tocar);
        navigator.mediaSession.setActionHandler("pause", pausar);
        navigator.mediaSession.setActionHandler("nexttrack", proximaManual);
        navigator.mediaSession.setActionHandler("previoustrack", anterior);
      } catch (_) {}
    }

    // Verifica se algum horário programado acabou de chegar.
    function verificarHorarios() {
      if (!musicas.length) return;

      const agora = horarioBrasilia();

      // Reinicia a referência quando muda o dia em Brasília.
      if (agora.data !== dataBrasiliaAnterior) {
        dataBrasiliaAnterior = agora.data;
        minutoBrasiliaAnterior = agora.minuto;
        agendamentosProcessados.clear();
        return;
      }

      // A comparação detecta a passagem do horário mesmo que
      // o temporizador tenha sido executado alguns minutos depois.
      for (const faixa of musicas) {
        if (!faixa.horario) continue;

        const correspondencia =
          /^([01]\d|2[0-3]):([0-5]\d)$/.exec(
            String(faixa.horario).trim()
          );

        if (!correspondencia) {
          console.warn(
            "Horário inválido na faixa:",
            faixa.titulo,
            faixa.horario
          );
          continue;
        }

        const horaAlvo = Number(correspondencia[1]) * 60 +
          Number(correspondencia[2]);

        const chave = `${agora.data}|${faixa.id}|${faixa.horario}`;

        const chegouAoHorario =
          minutoBrasiliaAnterior < horaAlvo &&
          agora.minuto >= horaAlvo;

        if (
          chegouAoHorario &&
          !agendamentosProcessados.has(chave)
        ) {
          agendamentosProcessados.add(chave);

          // Não interrompe a música atual.
          agendadasPendentes.push(faixa.id);

          mensagem(
            `Programada: ${faixa.titulo}. Tocará após a música atual.`
          );

          console.log(
            "Faixa programada adicionada à fila:",
            faixa.titulo,
            agora.texto
          );
        }
      }

      minutoBrasiliaAnterior = agora.minuto;
    }

    // Inicia uma faixa específica, normal ou programada.
    async function reproduzirFaixa(id, agendada = false) {
      const faixa = faixaPorId(id);

      if (!faixa) {
        mensagem("A faixa selecionada não foi encontrada.", true);
        return;
      }

      desejaReproduzir = true;
      tocandoAgendada = agendada;

      const minhaOperacao = ++operacaoReproducao;

      if (String(idFaixaAtual) !== String(faixa.id)) {
        audio.pause();

        idFaixaAtual = faixa.id;
        eventoFaixaResolvido = false;

        audio.src = faixa.audioUrl;
        audio.load();

        elapsed.textContent = "00:00";
        duration.textContent = "00:00";
        progress.value = 0;

        atualizarTituloMusica();
      }

      try {
        mensagem(
          agendada
            ? `Iniciando programação: ${faixa.titulo}`
            : `Carregando: ${faixa.titulo}`
        );

        await audio.play();

        if (minhaOperacao !== operacaoReproducao) return;

        reproduzindo = true;
        atualizarBotao();
        atualizarTituloMusica();
        mensagem(agendada ? `Programada: ${faixa.titulo}` : "Reproduzindo");
        salvar();

      } catch (erro) {
        if (minhaOperacao !== operacaoReproducao) return;

        console.error("Erro ao reproduzir:", faixa.titulo, erro);

        reproduzindo = false;
        atualizarBotao();

        mensagem("Erro ao tocar a faixa. Tentando continuar...", true);

        resolverFimDaFaixa();
      }
    }

    function tocar() {
      desejaReproduzir = true;

      const id = idFaixaAtual != null
        ? idFaixaAtual
        : faixaDaFila()?.id;

      if (id == null) return;

      reproduzirFaixa(id, tocandoAgendada);
    }

    function pausar() {
      desejaReproduzir = false;
      operacaoReproducao++;

      audio.pause();

      reproduzindo = false;
      atualizarBotao();
      mensagem("Pausado");
      salvar();
    }

    // Avança a fila normal sem repetir a faixa anterior
    // imediatamente no começo de uma nova rodada.
    function avancarFilaNormal() {
      const faixaAnterior = faixaDaFila();

      indice++;

      if (indice >= fila.length) {
        const outras = embaralhar(
          musicas.filter(m =>
            !faixaAnterior || m.id !== faixaAnterior.id
          )
        );

        fila = [
          ...outras.map(m => m.id),
          ...(faixaAnterior ? [faixaAnterior.id] : [])
        ];

        indice = 0;
      }

      const proximaFaixa = faixaDaFila();

      if (proximaFaixa) {
        reproduzirFaixa(proximaFaixa.id, false);
      }
    }

    // Uma faixa agendada tem prioridade após o término da atual.
    function resolverFimDaFaixa() {
      if (eventoFaixaResolvido) return;

      eventoFaixaResolvido = true;
      reproduzindo = false;
      atualizarBotao();

      if (tocandoAgendada) {
        // Terminou uma faixa programada.
        tocandoAgendada = false;

        if (agendadasPendentes.length) {
          const proximaAgendada = agendadasPendentes.shift();
          reproduzirFaixa(proximaAgendada, true);
          return;
        }

        // Se a música normal já havia terminado, agora avançamos.
        if (normalPrecisaAvancar) {
          normalPrecisaAvancar = false;
          avancarFilaNormal();
        } else {
          mensagem("Programação concluída.");
        }

        return;
      }

      // Terminou uma faixa da fila normal.
      normalPrecisaAvancar = true;

      if (agendadasPendentes.length) {
        const proximaAgendada = agendadasPendentes.shift();
        reproduzirFaixa(proximaAgendada, true);
        return;
      }

      normalPrecisaAvancar = false;
      avancarFilaNormal();
    }

    // Próxima manual: permite avançar mesmo com a tela bloqueada,
    // se o navegador entregar o comando de mídia.
    function proximaManual() {
      desejaReproduzir = true;

      // Uma faixa programada pendente tem prioridade.
      if (agendadasPendentes.length) {
        const id = agendadasPendentes.shift();
        eventoFaixaResolvido = true;
        normalPrecisaAvancar = false;
        reproduzirFaixa(id, true);
        return;
      }

      // Se a faixa atual é programada, o avanço manual
      // retoma a fila normal.
      if (tocandoAgendada) {
        tocandoAgendada = false;

        if (normalPrecisaAvancar) {
          normalPrecisaAvancar = false;
          avancarFilaNormal();
        } else {
          avancarFilaNormal();
        }

        return;
      }

      eventoFaixaResolvido = true;
      normalPrecisaAvancar = false;
      avancarFilaNormal();
    }

    function anterior() {
      desejaReproduzir = true;
      operacaoReproducao++;

      if (tocandoAgendada) {
        tocandoAgendada = false;
      }

      indice = (indice - 1 + fila.length) % fila.length;
      normalPrecisaAvancar = false;

      const faixa = faixaDaFila();

      if (faixa) {
        reproduzirFaixa(faixa.id, false);
      }
    }

    playBtn.addEventListener("click", () => {
      if (reproduzindo || !audio.paused) {
        pausar();
      } else {
        tocar();
      }
    });

    audio.addEventListener("play", () => {
      reproduzindo = true;
      atualizarBotao();
    });

    audio.addEventListener("playing", () => {
      reproduzindo = true;
      atualizarBotao();
      mensagem("Reproduzindo");
    });

    audio.addEventListener("pause", () => {
      reproduzindo = false;
      atualizarBotao();
      salvar();
    });

    audio.addEventListener("ended", resolverFimDaFaixa);

    audio.addEventListener("error", () => {
      if (!idFaixaAtual || eventoFaixaResolvido) return;

      mensagem("Erro no áudio. Tentando continuar...", true);
      resolverFimDaFaixa();
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = tempo(audio.duration);
      progress.disabled = !Number.isFinite(audio.duration);

      if (tempoPendente > 0 && Number.isFinite(audio.duration)) {
        try {
          audio.currentTime = Math.min(
            tempoPendente,
            Math.max(0, audio.duration - 0.5)
          );
        } catch (_) {}

        tempoPendente = 0;
      }
    });

    audio.addEventListener("timeupdate", () => {
      elapsed.textContent = tempo(audio.currentTime);
      duration.textContent = tempo(audio.duration);

      if (
        !buscando &&
        Number.isFinite(audio.duration) &&
        audio.duration > 0
      ) {
        progress.value =
          (audio.currentTime / audio.duration) * 100;
      }
    });

    audio.addEventListener("waiting", () => {
      if (!audio.paused) {
        mensagem("Carregando áudio...");
      }
    });

    progress.addEventListener("input", () => {
      buscando = true;
    });

    progress.addEventListener("change", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          (Number(progress.value) / 100) * audio.duration;
      }

      buscando = false;
      salvar();
    });

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value) / 100;
      salvar();
    });

    // Quando o navegador volta a executar a página, verificamos
    // se algum horário foi alcançado durante a suspensão.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        verificarHorarios();
      }
    });

    window.addEventListener("pageshow", verificarHorarios);
    window.addEventListener("pagehide", salvar);

    async function iniciar() {
      try {
        mensagem("Carregando lista de músicas...");

        const resposta = await fetch(JSON_URL, {
          cache: "no-store"
        });

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar o JSON.");
        }

        const dados = await resposta.json();

        config = dados.configuracao || {};

        const lista = Array.isArray(dados.musicas)
          ? dados.musicas
          : [];

        musicas = lista
          .filter(m => m && m.id != null && m.url)
          .map(m => ({
            ...m,
            audioUrl: urlDeAudio(m.url)
          }))
          .filter(m => m.audioUrl);

        if (!musicas.length) {
          throw new Error("O JSON não contém áudios compatíveis.");
        }

        prepararFila();

        audio.volume = Number(volume.value) / 100;

        playBtn.disabled = false;

        // Inicializa a referência horária sem disparar músicas
        // de horários que passaram antes de abrir o site.
        const agora = horarioBrasilia();

        dataBrasiliaAnterior = agora.data;
        minutoBrasiliaAnterior = agora.minuto;

        atualizarRelogio();
        atualizarTituloMusica();
        atualizarBotao();
        registrarControlesDeMidia();

        mensagem("Rádio pronta. Aperte o botão para tocar.");

      } catch (erro) {
        console.error("Erro ao iniciar rádio:", erro);

        playBtn.disabled = true;

        mensagem(
          "Erro ao carregar a rádio. Verifique o JSON e a conexão.",
          true
        );
      }
    }

    // Verifica a programação periodicamente enquanto o navegador
    // permite que o JavaScript seja executado.
    setInterval(verificarHorarios, 1000);
    setInterval(atualizarRelogio, 1000);
    setInterval(salvar, 5000);

    atualizarRelogio();
    iniciar();
  </script>
</body>
</html>
