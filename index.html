<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Minha Rádio</title>
<style>
/* Botão discreto de compartilhar */
#btnCompartilhar {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 9998;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border: 1px solid #374151;
  border-radius: 30px;

  background: rgba(31, 41, 55, 0.92);
  color: #d1d5db;

  font-size: 13px;
  font-weight: 500;

  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
  transition: background 0.2s, color 0.2s;
}

#btnCompartilhar:hover {
  background: #374151;
  color: #4ade80;
}

#btnCompartilhar svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#btnCompartilhar:focus-visible {
  outline: 2px solid #4ade80;
  outline-offset: 3px;
}

/* Telas pequenas */
@media (max-width: 380px) {
  #btnCompartilhar {
    bottom: 14px;
    left: 10px;
    padding: 9px 11px;
    font-size: 12px;
  }

  #btnInstall {
    bottom: 14px;
    right: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
}
</style>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

   .radio {
      width: 100%;
      max-width: 350px;
      padding: 28px 24px;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 24px;
      box-shadow: 0 15px 45px #0005;
    }

   .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
    }

   .play {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: #22c55e;
      color: #052e16;
      font-size: 28px;
      cursor: pointer;
    }

   .play:disabled {
      opacity:.5;
      cursor: wait;
    }

   .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #22c55e;
      cursor: pointer;
    }

   .times {
      display: flex;
      justify-content: space-between;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 5px;
    }

   .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

   .status {
      min-height: 18px;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 13px;
    }

   .error { color: #fca5a5; }
 
#titulo-musica {
  font-size: 17px;
  font-weight: bold;
  margin: 12px 0;
  color: #ffffff;
}

#relogio-brasilia {
  font-size: 15px;
  color: #4ade80;
  margin-bottom: 24px;
  font-variant-numeric: tabular-nums;
}

  </style>
</head>

<body>
  <main class="radio">
    <img
      class="logo"
      src="https://i.imgur.com/ZRHzLQK.jpeg"
      alt="https://i.imgur.com/ZRHzLQK.jpeg"
      onerror="this.style.display='none'"
    >

    <h1>God's life</h1>
    
<div id="titulo-musica">Minha Rádio</div>

<div id="relogio-brasilia">
  --:--:--
</div>

    <audio id="audio" preload="auto"></audio>

    <div class="controls">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Reproduzir"
        disabled
      >▶</button>
    </div>

    <input id="progress" type="range"
      min="0" max="100" value="0"
      aria-label="Progresso" disabled>

    <div class="times">
      <span id="elapsed">00:00</span>
      <span id="duration">00:00</span>
    </div>

    <div class="volume">
      <span aria-hidden="true">🔊</span>
      <input id="volume" type="range"
        min="0" max="100" value="80"
        aria-label="Volume">
    </div>

    <div id="status" class="status">Carregando rádio...</div>
  </main>

  <script>
    "use strict";

    const JSON_URL =
      "https://raw.githubusercontent.com/Isac-Arqueiro/mylist/refs/heads/main/musicas.json";

    const STORAGE_KEY = "radio-audio-only-v1";

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const elapsed = document.getElementById("elapsed");
    const duration = document.getElementById("duration");
    const status = document.getElementById("status");

    let config = {};
    let musicas = [];
    let fila = [];
    let indice = 0;
    let buscando = false;
    let tempoPendente = 0;
    let reproduzindo = false;

    function mensagem(texto, erro = false) {
      status.textContent = texto;
      status.classList.toggle("error", erro);
    }

    function tempo(segundos) {
      if (!Number.isFinite(segundos) || segundos < 0) {
        return "00:00";
      }

      const n = Math.floor(segundos);
      return String(Math.floor(n / 60)).padStart(2, "0") +
        ":" + String(n % 60).padStart(2, "0");
    }

    function embaralhar(lista) {
      const resultado = [...lista];

      for (let i = resultado.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [resultado[i], resultado[j]] =
          [resultado[j], resultado[i]];
      }

      return resultado;
    }

    function urlDeAudio(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        const caminho = u.pathname.toLowerCase();

        // Não reproduzir links de páginas/vídeos do YouTube.
        if (
          host === "youtu.be" ||
          host.endsWith("youtube.com") ||
          host.endsWith("youtube-nocookie.com")
        ) {
          return null;
        }

        // Links públicos do Google Drive.
        if (
          host === "drive.google.com" ||
          host === "docs.google.com"
        ) {
          let id = u.searchParams.get("id");
          const partes = caminho.split("/");

          if (!id) {
            const i = partes.findIndex(p => p === "d");
            if (i >= 0) id = partes[i + 1];
          }

          if (!id) return null;

          return "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(id);
        }

        // Endereços de arquivos de áudio reconhecíveis.
        if (/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)(?:$)/i.test(caminho)) {
          return url;
        }

        // Endereços sem extensão podem ser streams ou links diretos.
        // O navegador verificará se o conteúdo é áudio.
        return url;
      } catch (_) {
        return null;
      }
    }

    function faixaAtual() {
      return musicas.find(m => m.id === fila[indice]) || null;
    }

    function salvar() {
      if (!fila.length) return;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          fila,
          indice,
          tempo: audio.currentTime || 0,
          volume: Number(volume.value)
        }));
      } catch (_) {}
    }

    function prepararFila() {
      let salvo = null;

      try {
        salvo = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (_) {}

      const ids = new Set(musicas.map(m => m.id));

      if (
        salvo &&
        Array.isArray(salvo.fila) &&
        salvo.fila.length === musicas.length &&
        salvo.fila.every(id => ids.has(id)) &&
        new Set(salvo.fila).size === musicas.length &&
        Number.isInteger(salvo.indice) &&
        salvo.indice >= 0 &&
        salvo.indice < salvo.fila.length
      ) {
        fila = salvo.fila;
        indice = salvo.indice;
        tempoPendente = Math.max(0, Number(salvo.tempo) || 0);

        if (salvo.volume != null) {
          volume.value = Math.max(
            0, Math.min(100, Number(salvo.volume))
          );
        }
        return;
      }

      const primeira = config.tocarPrimeiro
        ? musicas.find(m => m.id === config.tocarPrimeiro)
        : null;

      fila = [
       ...(primeira ? [primeira.id] : []),
       ...embaralhar(musicas.filter(m => m !== primeira))
         .map(m => m.id)
      ];

      indice = 0;
      tempoPendente = 0;
    }

    function atualizarBotao() {
      playBtn.textContent = reproduzindo ? "Ⅱ" : "▶";
      playBtn.setAttribute(
        "aria-label", reproduzindo ? "Pausar" : "Reproduzir"
      );
    }

    async function tocar() {
      const faixa = faixaAtual();
      if (!faixa) return;

      try {
        if (audio.dataset.faixa !== faixa.id) {
          audio.pause();
          audio.dataset.faixa = faixa.id;
          audio.src = faixa.audioUrl;
          audio.load();

          if (tempoPendente > 0) {
            const salvo = tempoPendente;
            tempoPendente = 0;

            await new Promise(resolve => {
              if (audio.readyState >= 1) {
                resolve();
              } else {
                audio.addEventListener(
                  "loadedmetadata", resolve, { once: true }
                );
                audio.addEventListener(
                  "error", resolve, { once: true }
                );
              }
            });

            if (Number.isFinite(audio.duration)) {
              audio.currentTime = Math.min(salvo, audio.duration);
            }
          }
        }

        await audio.play();
        reproduzindo = true;
        atualizarBotao();
        mensagem("Reproduzindo");
        salvar();
      } catch (e) {
        reproduzindo = false;
        atualizarBotao();
        mensagem("Não foi possível tocar este áudio. Tentando a próxima faixa...", true);
        proxima();
      }
    }

    function pausar() {
      audio.pause();
      reproduzindo = false;
      atualizarBotao();
      mensagem("Pausado");
      salvar();
    }

    function proxima() {
      if (!fila.length) return;

      // Guarda a faixa que acabou antes de avançar o índice.
      const faixaAnterior = faixaAtual();
      indice++;

      if (indice >= fila.length) {
        // Começa uma nova rodada sem repetir imediatamente a última faixa.
        const outras = embaralhar(
          musicas.filter(m => m.id !== (faixaAnterior && faixaAnterior.id))
        );

        fila = [
          ...outras.map(m => m.id),
          ...(faixaAnterior ? [faixaAnterior.id] : [])
        ];
        indice = 0;
      }

      tempoPendente = 0;
      audio.removeAttribute("src");
      delete audio.dataset.faixa;
      audio.load();

      salvar();
      atualizarTituloMusica();
      tocar();
    }

    playBtn.addEventListener("click", () => {
      if (reproduzindo) pausar();
      else tocar();
    });

    audio.addEventListener("play", () => {
      reproduzindo = true;
      atualizarBotao();
    });

    audio.addEventListener("pause", () => {
      reproduzindo = false;
      atualizarBotao();
      salvar();
    });

    audio.addEventListener("ended", proxima);

    audio.addEventListener("error", () => {
      if (audio.dataset.faixa) {
        proxima();
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = tempo(audio.duration);
      progress.disabled = false;
    });

    audio.addEventListener("timeupdate", () => {
      elapsed.textContent = tempo(audio.currentTime);
      duration.textContent = tempo(audio.duration);

      if (!buscando && Number.isFinite(audio.duration) &&
          audio.duration > 0) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    progress.addEventListener("input", () => {
      buscando = true;
    });

    progress.addEventListener("change", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          (Number(progress.value) / 100) * audio.duration;
      }
      buscando = false;
      salvar();
    });

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value) / 100;
      salvar();
    });

    async function iniciar() {
      try {
        const resposta = await fetch(JSON_URL, { cache: "no-store" });
        if (!resposta.ok) throw new Error("Erro ao carregar JSON");

        const dados = await resposta.json();
        config = dados.configuracao || {};

        const lista = Array.isArray(dados.musicas) ? dados.musicas : [];

        // Exclui YouTube e conserva somente links de áudio.
        musicas = lista
         .filter(m => m && m.id && m.url)
         .map(m => ({...m, audioUrl: urlDeAudio(m.url) }))
         .filter(m => m.audioUrl);

        if (!musicas.length) {
          throw new Error("O JSON não contém links de áudio compatíveis.");
        }

        prepararFila();
        audio.volume = Number(volume.value) / 100;
        playBtn.disabled = false;
        mensagem("Rádio pronta");
      } catch (e) {
        console.error(e);
        playBtn.disabled = true;
        mensagem("Erro ao carregar a rádio ou encontrar áudios.", true);
      }
    }

    setInterval(salvar, 2000);
    window.addEventListener("pagehide", salvar);

    iniciar();

const tituloMusica = document.getElementById("titulo-musica");
const relogioBrasilia = document.getElementById("relogio-brasilia");

// Relógio no horário oficial de Brasília
function atualizarRelogio() {
  relogioBrasilia.textContent = new Intl.DateTimeFormat("pt-BR", {
    timeZone: "America/Sao_Paulo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(new Date());
}

atualizarRelogio();
setInterval(atualizarRelogio, 1000);

// Atualiza o nome da faixa atual
function atualizarTituloMusica() {
  const faixa = faixaAtual();

  tituloMusica.textContent =
    faixa && faixa.titulo
      ? faixa.titulo
      : "Minha Rádio";
}
  </script>
</body>
</html>

<style>
#btnInstall {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;

  border: none;
  border-radius: 50px;
  padding: 14px 20px;

  background: #000;
  color: #fff;

  font-size: 16px;
  font-weight: bold;

  box-shadow: 0 4px 12px rgba(0,0,0,.3);

  cursor: pointer;

  display: none;

  transition: all .3s ease;
}

#btnInstall:hover {
  transform: scale(1.05);
}
</style>

<button id="btnInstall">📲 Instalar App</button>

<script>
let deferredPrompt;

const btnInstall = document.getElementById("btnInstall");

// Verifica se já está instalado
function isAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

// Se não estiver instalado
if (!isAppInstalled()) {

  window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault();

    deferredPrompt = e;

    btnInstall.style.display = "block";
  });

}

// Clique no botão
btnInstall.addEventListener("click", async () => {

  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;

  console.log("Resultado:", outcome);

  deferredPrompt = null;

  btnInstall.style.display = "none";
});

// Quando instalar
window.addEventListener("appinstalled", () => {

  console.log("PWA instalado");

  btnInstall.style.display = "none";
});

// Registrar Service Worker
if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch((err) => console.log("Erro SW:", err));

}
</script>
<button id="btnCompartilhar" type="button"
  aria-label="Compartilhar a rádio God's Life">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <path d="m8.7 10.7 6.6-4.4"></path>
    <path d="m8.7 13.3 6.6 4.4"></path>
  </svg>
  Compartilhar rádio
</button>

<script>
(function () {
  const botao = document.getElementById("btnCompartilhar");

  const dados = {
    title: "God's Life - Rádio",
    text: "Ouça a God's Life! Uma rádio para abençoar sua vida.",
    url: "https://godslifebr-ui.github.io/godslife/"
  };

  botao.addEventListener("click", async function () {
    try {
      if (navigator.share) {
        await navigator.share(dados);
      } else if (navigator.clipboard &&
                 window.isSecureContext) {
        await navigator.clipboard.writeText(dados.url);
        alert("Link da rádio copiado! Compartilhe com seus amigos.");
      } else {
        window.prompt("Copie o link da rádio:", dados.url);
      }
    } catch (erro) {
      if (erro.name !== "AbortError") {
        window.prompt("Compartilhe o link da rádio:", dados.url);
      }
    }
  });
})();
</script>
