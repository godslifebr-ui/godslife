<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="https://godslifebr-ui.github.io/godslife/manifest.json">
<meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">

  <title>God's life — Minha Rádio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .radio {
      width: 100%;
      max-width: 350px;
      padding: 28px 24px;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 24px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
    }

    #titulo-musica {
      font-size: 17px;
      font-weight: bold;
      margin: 12px 0;
      color: #fff;
      overflow-wrap: anywhere;
    }

    #relogio-brasilia {
      font-size: 15px;
      color: #4ade80;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
    }

    .play {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: #22c55e;
      color: #052e16;
      font-size: 28px;
      cursor: pointer;
    }

    .play:disabled {
      opacity: .5;
      cursor: wait;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #22c55e;
      cursor: pointer;
    }

    input[type="range"]:disabled {
      opacity: .5;
      cursor: default;
    }

    .times {
      display: flex;
      justify-content: space-between;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 5px;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .status {
      min-height: 18px;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      color: #fca5a5;
    }
  </style>
</head>

<body>
  <main class="radio">

    <img
      class="logo"
      src="https://i.imgur.com/ZRHzLQK.jpeg"
      alt="Logo God's life"
      onerror="this.style.display='none'"
    >

    <h1>God's life</h1>

    <div id="titulo-musica">Minha Rádio</div>

    <div id="relogio-brasilia">--:--:--</div>

    <audio id="audio" preload="auto"></audio>

    <div class="controls">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Reproduzir"
        disabled
      >▶</button>
    </div>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      aria-label="Progresso da música"
      disabled
    >

    <div class="times">
      <span id="elapsed">00:00</span>
      <span id="duration">00:00</span>
    </div>

    <div class="volume">
      <span aria-hidden="true">🔊</span>
      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="80"
        aria-label="Volume"
      >
    </div>

    <div id="status" class="status">
      Carregando rádio...
    </div>

  </main>

  <script>
    "use strict";

    // Endereço original da lista de músicas.
    const JSON_URL =
      "https://raw.githubusercontent.com/Isac-Arqueiro/mylist/refs/heads/main/musicas.json";

    const STORAGE_KEY = "radio-audio-only-v1";

    const audio = document.getElementById("audio");

    // Carrega a próxima faixa em segundo plano para tentar reduzir a espera.
    // O navegador/servidor pode limitar o pré-carregamento em dados móveis.
    const audioReserva = new Audio();
    audioReserva.preload = "auto";
    let idFaixaReservada = null;
    const playBtn = document.getElementById("play");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const elapsed = document.getElementById("elapsed");
    const duration = document.getElementById("duration");
    const status = document.getElementById("status");
    const tituloMusica = document.getElementById("titulo-musica");
    const relogioBrasilia = document.getElementById("relogio-brasilia");

    let config = {};
    let musicas = [];
    let fila = [];
    let indice = 0;

    let buscando = false;
    let tempoPendente = 0;
    let reproduzindo = false;
    let desejaReproduzir = false;

    // Controla trocas duplicadas e operações antigas.
    let versaoFaixa = 0;
    let ultimaVersaoAvancada = -1;
    let operacaoReproducao = 0;
    let erroEmTratamento = false;

    // Mantém a tela ligada enquanto esta página da rádio estiver visível.
    let bloqueioTela = null;

    async function manterTelaLigada() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }

      try {
        if (!bloqueioTela || bloqueioTela.released) {
          bloqueioTela = await navigator.wakeLock.request("screen");
          bloqueioTela.addEventListener("release", () => {
            bloqueioTela = null;
          });
        }
      } catch (erro) {
        // Alguns aparelhos/navegadores podem impedir o bloqueio de tela.
        console.log("Não foi possível manter a tela ligada:", erro);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        manterTelaLigada();
      }
    });

    window.addEventListener("pageshow", manterTelaLigada);


    function mensagem(texto, erro = false) {
      status.textContent = texto;
      status.classList.toggle("error", erro);
    }

    function tempo(segundos) {
      if (!Number.isFinite(segundos) || segundos < 0) {
        return "00:00";
      }

      const n = Math.floor(segundos);

      return String(Math.floor(n / 60)).padStart(2, "0") +
        ":" +
        String(n % 60).padStart(2, "0");
    }

    function embaralhar(lista) {
      const resultado = [...lista];

      for (let i = resultado.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [resultado[i], resultado[j]] =
          [resultado[j], resultado[i]];
      }

      return resultado;
    }

    function urlDeAudio(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        const caminho = u.pathname.toLowerCase();

        // Não aceita links de páginas do YouTube.
        if (
          host === "youtu.be" ||
          host === "youtube.com" ||
          host.endsWith(".youtube.com") ||
          host === "youtube-nocookie.com" ||
          host.endsWith(".youtube-nocookie.com")
        ) {
          return null;
        }

        // Converte links públicos do Google Drive.
        if (
          host === "drive.google.com" ||
          host === "docs.google.com"
        ) {
          let id = u.searchParams.get("id");
          const partes = caminho.split("/");

          if (!id) {
            const i = partes.findIndex(p => p === "d");

            if (i >= 0) {
              id = partes[i + 1];
            }
          }

          if (!id) return null;

          return "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(id);
        }

        // Aceita arquivos de áudio conhecidos.
        if (
          /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/.test(caminho)
        ) {
          return u.href;
        }

        // Outros links serão testados pelo navegador.
        return u.href;

      } catch (_) {
        return null;
      }
    }

    function faixaAtual() {
      return musicas.find(m => m.id === fila[indice]) || null;
    }

    function prepararProximaFaixa() {
      // Não inicia outro download antes de a faixa atual ter algum áudio
      // guardado no buffer. Isso ajuda a evitar competir com a música atual.
      if (audio.paused || !fila.length || indice + 1 >= fila.length) return;

      let segundosEmBuffer = 0;
      try {
        for (let i = 0; i < audio.buffered.length; i++) {
          if (audio.buffered.start(i) <= audio.currentTime &&
              audio.buffered.end(i) >= audio.currentTime) {
            segundosEmBuffer = audio.buffered.end(i) - audio.currentTime;
            break;
          }
        }
      } catch (_) {}

      if (segundosEmBuffer < 12) return;

      const proximaId = fila[indice + 1];
      const proximaFaixa = musicas.find(m => m.id === proximaId);
      if (!proximaFaixa || !proximaFaixa.audioUrl) return;
      if (idFaixaReservada === String(proximaFaixa.id)) return;

      idFaixaReservada = String(proximaFaixa.id);
      audioReserva.src = proximaFaixa.audioUrl;
      try { audioReserva.load(); } catch (_) {}
    }

    function salvar() {
      if (!fila.length) return;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          fila,
          indice,
          tempo: audio.currentTime || 0,
          volume: Number(volume.value)
        }));
      } catch (_) {}
    }

    function prepararFila() {
      let salvo = null;

      try {
        salvo = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (_) {}

      const ids = new Set(musicas.map(m => m.id));

      if (
        salvo &&
        Array.isArray(salvo.fila) &&
        salvo.fila.length === musicas.length &&
        salvo.fila.every(id => ids.has(id)) &&
        new Set(salvo.fila).size === musicas.length &&
        Number.isInteger(salvo.indice) &&
        salvo.indice >= 0 &&
        salvo.indice < salvo.fila.length
      ) {
        fila = salvo.fila;
        indice = salvo.indice;

        tempoPendente = Math.max(
          0,
          Number(salvo.tempo) || 0
        );

        if (salvo.volume != null) {
          volume.value = Math.max(
            0,
            Math.min(100, Number(salvo.volume))
          );
        }

        return;
      }

      const primeira = config.tocarPrimeiro
        ? musicas.find(m => m.id === config.tocarPrimeiro)
        : null;

      fila = [
        ...(primeira ? [primeira.id] : []),
        ...embaralhar(
          musicas.filter(m => !primeira || m.id !== primeira.id)
        ).map(m => m.id)
      ];

      indice = 0;
      tempoPendente = 0;
    }

    function atualizarBotao() {
      playBtn.textContent = reproduzindo ? "Ⅱ" : "▶";

      playBtn.setAttribute(
        "aria-label",
        reproduzindo ? "Pausar" : "Reproduzir"
      );

      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState =
          reproduzindo ? "playing" : "paused";
      }
    }

    function atualizarTituloMusica() {
      const faixa = faixaAtual();

      tituloMusica.textContent =
        faixa && faixa.titulo
          ? faixa.titulo
          : "Minha Rádio";

      if ("mediaSession" in navigator && "MediaMetadata" in window) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: faixa?.titulo || "God's life",
          artist: "God's life",
          album: "Minha Rádio",
          artwork: [
            {
              src: "https://i.imgur.com/ZRHzLQK.jpeg",
              sizes: "192x192",
              type: "image/jpeg"
            }
          ]
        });
      }
    }

    function atualizarRelogio() {
      relogioBrasilia.textContent =
        new Intl.DateTimeFormat("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(new Date());
    }

    function registrarControlesDeMidia() {
      if (!("mediaSession" in navigator)) return;

      try {
        navigator.mediaSession.setActionHandler("play", () => {
          tocar();
        });

        navigator.mediaSession.setActionHandler("pause", () => {
          pausar();
        });

        navigator.mediaSession.setActionHandler("nexttrack", () => {
          desejaReproduzir = true;
          proxima();
        });

        navigator.mediaSession.setActionHandler("previoustrack", () => {
          anterior();
        });
      } catch (_) {}
    }

    async function tocar() {
      const faixa = faixaAtual();

      if (!faixa) {
        mensagem("Nenhuma música disponível.", true);
        return;
      }

      desejaReproduzir = true;

      const minhaOperacao = ++operacaoReproducao;

      try {
        if (audio.dataset.faixa !== String(faixa.id)) {
          audio.pause();

          versaoFaixa++;
          erroEmTratamento = false;

          audio.dataset.faixa = String(faixa.id);
          audio.src = faixa.audioUrl;

          elapsed.textContent = "00:00";
          duration.textContent = "00:00";
          progress.value = 0;

          audio.load();

          atualizarTituloMusica();
        }

        mensagem("Preparando reprodução...");

        await audio.play();

        // Ignora o resultado de uma tentativa que ficou para trás.
        if (minhaOperacao !== operacaoReproducao) return;

        reproduzindo = true;
        atualizarBotao();
        mensagem("Reproduzindo");
        salvar();

      } catch (e) {
        if (minhaOperacao !== operacaoReproducao) return;

        reproduzindo = false;
        atualizarBotao();

        console.warn("Falha ao reproduzir áudio:", e);

        mensagem(
          "Falha ao tocar esta música. Tentando a próxima...",
          true
        );

        proxima();
      }
    }

    function pausar() {
      desejaReproduzir = false;
      operacaoReproducao++;

      audio.pause();

      reproduzindo = false;
      atualizarBotao();
      mensagem("Pausado");

      salvar();
    }

    function proxima() {
      if (!fila.length) return;

      // Uma mesma faixa só pode avançar uma vez por carregamento.
      if (ultimaVersaoAvancada === versaoFaixa) return;

      ultimaVersaoAvancada = versaoFaixa;

      const faixaAnterior = faixaAtual();

      indice++;

      if (indice >= fila.length) {
        // Nova rodada embaralhada, evitando repetir imediatamente
        // a última faixa, quando há outras músicas disponíveis.
        const outras = embaralhar(
          musicas.filter(m =>
            !faixaAnterior || m.id !== faixaAnterior.id
          )
        );

        fila = [
          ...outras.map(m => m.id),
          ...(faixaAnterior ? [faixaAnterior.id] : [])
        ];

        indice = 0;
      }

      tempoPendente = 0;
      operacaoReproducao++;

      audio.pause();
      audio.removeAttribute("src");
      delete audio.dataset.faixa;
      audio.load();

      reproduzindo = false;
      atualizarBotao();
      atualizarTituloMusica();
      salvar();

      // A troca é feita imediatamente; não espera um temporizador.
      if (desejaReproduzir) {
        tocar();
      } else {
        mensagem("Próxima música pronta");
      }
    }

    function anterior() {
      if (!fila.length) return;

      operacaoReproducao++;

      indice = (indice - 1 + fila.length) % fila.length;
      tempoPendente = 0;

      // Permite tocar novamente uma faixa já visitada.
      ultimaVersaoAvancada = -1;

      audio.pause();
      audio.removeAttribute("src");
      delete audio.dataset.faixa;
      audio.load();

      reproduzindo = false;
      atualizarBotao();
      atualizarTituloMusica();
      salvar();

      if (desejaReproduzir) {
        tocar();
      } else {
        mensagem("Faixa anterior pronta");
      }
    }

    // Aplica o ponto salvo assim que os metadados estiverem disponíveis.
    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = tempo(audio.duration);
      progress.disabled = !Number.isFinite(audio.duration);

      if (tempoPendente > 0 && Number.isFinite(audio.duration)) {
        const ponto = Math.min(
          tempoPendente,
          Math.max(0, audio.duration - 0.5)
        );

        try {
          audio.currentTime = ponto;
        } catch (_) {}

        tempoPendente = 0;
      }
    });

    audio.addEventListener("play", () => {
      reproduzindo = true;
      atualizarBotao();
    });

    audio.addEventListener("playing", () => {
      reproduzindo = true;
      atualizarBotao();
      mensagem("Reproduzindo");
      prepararProximaFaixa();
    });

    audio.addEventListener("pause", () => {
      reproduzindo = false;
      atualizarBotao();
      salvar();
    });

    audio.addEventListener("ended", () => {
      // O navegador informa que a faixa terminou.
      // A proteção impede dois avanços para a mesma faixa.
      if (audio.ended) {
        proxima();
      }
    });

    audio.addEventListener("error", () => {
      if (!audio.dataset.faixa || erroEmTratamento) return;

      erroEmTratamento = true;

      mensagem(
        "Erro nesta música. Tentando a próxima...",
        true
      );

      proxima();
    });

    audio.addEventListener("timeupdate", () => {
      prepararProximaFaixa();
      elapsed.textContent = tempo(audio.currentTime);
      duration.textContent = tempo(audio.duration);

      if (
        !buscando &&
        Number.isFinite(audio.duration) &&
        audio.duration > 0
      ) {
        progress.value =
          (audio.currentTime / audio.duration) * 100;
      }
    });

    audio.addEventListener("durationchange", () => {
      if (Number.isFinite(audio.duration)) {
        duration.textContent = tempo(audio.duration);
      }
    });

    audio.addEventListener("waiting", () => {
      if (!audio.paused) {
        mensagem("Carregando áudio...");
      }
    });

    playBtn.addEventListener("click", () => {
      manterTelaLigada();

      if (reproduzindo || !audio.paused) {
        pausar();
      } else {
        tocar();
      }
    });

    progress.addEventListener("input", () => {
      buscando = true;
    });

    progress.addEventListener("change", () => {
      if (
        Number.isFinite(audio.duration) &&
        audio.duration > 0
      ) {
        audio.currentTime =
          (Number(progress.value) / 100) * audio.duration;
      }

      buscando = false;
      salvar();
    });

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value) / 100;
      salvar();
    });

    // Recupera a sequência quando a página volta a executar.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && desejaReproduzir && audio.ended) {
        proxima();
      }
    });

    window.addEventListener("pageshow", () => {
      if (desejaReproduzir && audio.ended) {
        proxima();
      }
    });

    window.addEventListener("pagehide", salvar);

    // Persiste o progresso quando o navegador permite executar o timer.
    setInterval(salvar, 5000);

    async function iniciar() {
      try {
        mensagem("Carregando lista de músicas...");

        const resposta = await fetch(JSON_URL, {
          cache: "no-store"
        });

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar o JSON.");
        }

        const dados = await resposta.json();

        config = dados.configuracao || {};

        const lista = Array.isArray(dados.musicas)
          ? dados.musicas
          : [];

        musicas = lista
          .filter(m => m && m.id != null && m.url)
          .map(m => ({
            ...m,
            audioUrl: urlDeAudio(m.url)
          }))
          .filter(m => m.audioUrl);

        if (!musicas.length) {
          throw new Error(
            "O JSON não contém links de áudio compatíveis."
          );
        }

        prepararFila();

        audio.volume = Number(volume.value) / 100;

        playBtn.disabled = false;

        atualizarTituloMusica();
        registrarControlesDeMidia();

        mensagem("Rádio pronta. Aperte o botão para tocar.");

      } catch (e) {
        console.error("Erro ao iniciar a rádio:", e);

        playBtn.disabled = true;

        mensagem(
          "Erro ao carregar a rádio. Verifique a conexão e o JSON.",
          true
        );
      }
    }

    volume.addEventListener("change", salvar);

    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);

    manterTelaLigada();
    iniciar();
  </script>

<button id="share-site-btn" aria-label="Compartilhar God’s Life">
  <svg viewBox="0 0 24 24" width="22" height="22"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <path d="M8.7 10.7 15.3 6.3"></path>
    <path d="m8.7 13.3 6.6 4.4"></path>
  </svg>
  <span>Compartilhar</span>
</button>

<style>
  #share-site-btn {
    position: fixed;
    bottom: 22px;
    left: 22px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px;
    background: #171717;
    color: #fff;
    font: 600 14px/1.2 sans-serif;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform .2s, background .2s;
  }

  #share-site-btn:hover {
    background: #333;
    transform: translateY(-2px);
  }

  #share-site-btn:focus-visible {
    outline: 3px solid #888;
    outline-offset: 4px;
  }

  @media (max-width: 480px) {
    #share-site-btn {
      bottom: 16px;
      left: 16px;
      padding: 12px 15px;
    }
  }
</style>

<script>
  document.getElementById('share-site-btn').addEventListener('click', async () => {
    const shareData = {
      title: "God's Life",
      text: 'Conheça o God’s Life!',
      url: 'https://godslifebr-ui.github.io/godslife/'
    };

    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(shareData.url);
        alert('Link do God’s Life copiado!');
      } else {
        window.prompt('Copie o link do God’s Life:', shareData.url);
      }
    } catch (error) {
      if (error.name !== 'AbortError') {
        window.prompt('Copie o link do God’s Life:', shareData.url);
      }
    }
  });
</script>
<style>
#btnInstall {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;

  border: none;
  border-radius: 50px;
  padding: 14px 20px;

  background: #000;
  color: #fff;

  font-size: 16px;
  font-weight: bold;

  box-shadow: 0 4px 12px rgba(0,0,0,.3);

  cursor: pointer;

  display: none;

  transition: all .3s ease;
}

#btnInstall:hover {
  transform: scale(1.05);
}
</style>

<button id="btnInstall">📲 Instalar App</button>

<script>
let deferredPrompt;

const btnInstall = document.getElementById("btnInstall");

// Verifica se já está instalado
function isAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

// Se não estiver instalado
if (!isAppInstalled()) {

  window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault();

    deferredPrompt = e;

    btnInstall.style.display = "block";
  });

}

// Clique no botão
btnInstall.addEventListener("click", async () => {

  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;

  console.log("Resultado:", outcome);

  deferredPrompt = null;

  btnInstall.style.display = "none";
});

// Quando instalar
window.addEventListener("appinstalled", () => {

  console.log("PWA instalado");

  btnInstall.style.display = "none";
});

// Registrar Service Worker
if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch((err) => console.log("Erro SW:", err));

}
</script>
</body>
</html>
